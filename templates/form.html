<!-- form.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚔️ Clash Royale Forms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#1a1a1a; color:#fff; font-family:'Trebuchet MS',sans-serif; padding-top:70px; }
    .navbar { background:linear-gradient(90deg,#004aad,#0077ff); box-shadow:0 4px 8px rgba(0,0,0,0.4); }
    .navbar-brand { font-weight:bold; color:#FFD700!important; text-shadow:2px 2px #000; }
    .nav-link:hover { color:#FFD700!important; }
    .btn-play { background:#FFD700; color:#000; font-weight:bold; border-radius:8px; text-shadow:1px 1px #fff; }
    .card { border-radius:12px; }
    .action-btn { transition:all 0.3s ease; }
    .action-btn:hover { transform:scale(1.05); filter:brightness(90%); }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">⚔️ Clash Royale</a>
      <button class="navbar-toggler text-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav me-3">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/search">Search</a></li>
          <li class="nav-item"><a class="nav-link" href="/form">Forms</a></li>
        </ul>
        <a href="#" class="btn btn-play">Play Now</a>
      </div>
    </div>
  </nav>

  <!-- Forms Section -->
  <div class="container py-4">
    <h1 class="text-center mb-4">⚔️ Manage Clash Royale Cards</h1>

    <!-- Create Card -->
    <h2 class="mt-5 text-primary"><i class="bi bi-plus-circle"></i> Create Card</h2>
    <form action="/add" method="POST" class="card p-4 shadow-sm mb-4">
      <div class="row g-3">
        <div class="col-md-6"><input type="text" name="card_name" class="form-control" placeholder="Card Name" required></div>
        <div class="col-md-6"><input type="number" name="elixir_cost" class="form-control" placeholder="Elixir Cost" min="1" max="10" required></div>
        <div class="col-md-6"><input type="text" name="card_type" class="form-control" placeholder="Card Type" required></div>
        <div class="col-md-6"><input type="text" name="rarity" class="form-control" placeholder="Rarity" required></div>
        <div class="col-md-6"><input type="text" name="attack_type" class="form-control" placeholder="Attack Type" required></div>
        <div class="col-md-6"><input type="number" step="0.1" name="card_rating" class="form-control" placeholder="Card Rating" min="0" max="100" required></div>
      </div>
      <button type="submit" class="btn btn-success btn-lg mt-3 shadow-sm action-btn">
        <i class="bi bi-check-circle"></i> Create
      </button>
    </form>

    <!-- Update Card -->
    <h2 class="mt-5 text-warning"><i class="bi bi-pencil-square"></i> Update Card</h2>
    <form action="/update" method="POST" class="card p-4 shadow-sm mb-4">
      <div class="mb-3">
        <select id="cardSelect" name="card_name" class="form-select form-select-lg shadow-sm" required>
          <option value="">Select a card...</option>
          {% for card in cards %}
            <option value="{{ card['card_name'] }}">{{ card['card_name'] }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="row g-3">
        <div class="col-md-6"><input type="text" id="attack_type" name="attack_type" class="form-control" placeholder="Attack Type" required></div>
        <div class="col-md-6"><input type="text" id="card_type" name="card_type" class="form-control" placeholder="Card Type" required></div>
        <div class="col-md-6"><input type="number" id="elixir_cost" name="elixir_cost" class="form-control" placeholder="Elixir Cost" required></div>
        <div class="col-md-6"><input type="text" id="rarity" name="rarity" class="form-control" placeholder="Rarity" required></div>
        <div class="col-md-6"><input type="number" id="card_rating" name="card_rating" class="form-control" placeholder="Card Rating" required></div>
      </div>
      <button type="submit" class="btn btn-warning btn-lg mt-3 shadow-sm action-btn">
        <i class="bi bi-arrow-repeat"></i> Update
      </button>
    </form>

    <!-- Delete Card -->
    <h2 class="mt-5 text-danger"><i class="bi bi-trash-fill"></i> Delete Card</h2>
    <form action="/delete" method="POST" class="card p-4 shadow-sm mb-4 d-flex flex-column flex-md-row align-items-md-end gap-3">
      <div class="flex-grow-1">
        <label for="card_id" class="form-label fw-bold">Choose Card</label>
        <select name="card_id" id="card_id" class="form-select form-select-lg shadow-sm" required>
          {% for card in cards %}
            <option value="{{ card.id }}">{{ card.card_name }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <button type="submit" class="btn btn-danger btn-lg shadow-sm action-btn">
          <i class="bi bi-x-circle"></i> Delete
        </button>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
